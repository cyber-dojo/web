AllCops:
  DisabledByDefault: true
  Exclude:
    # Web's tests live under source/, not at the repo root as creator's and
    # dashboard's do - which is also why they ship in the image. Decision D1 of
    # the merge plan moves them to test/, and this pattern moves with them.
    - source/test/**/*

# Line length only, deliberately. This repo has never been linted, and a full
# cop set reports over 1500 offences across 78 files - almost all whitespace and
# layout drift. Adopting rubocop wholesale is a separate decision; this file says
# nothing about it.
#
# 80 matches creator and dashboard. Long lines here come from long identifiers
# rather than dense logic, so they gain nothing from more room.
Layout/LineLength:
  Enabled: true
  Max: 80
