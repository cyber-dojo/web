inherit_from: .rubocop_todo.yml

# Add to the todo's Exclude lists rather than replacing them, so a cop
# configured in both files keeps its grandfathered files.
inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  Exclude:
    # The tests hold hundreds of lines over 80. Bringing them under the ceiling
    # is its own piece of work, so they are excluded until then.
    - test/**/*

# The full cop set runs. Today's offences are grandfathered file-by-file in
# .rubocop_todo.yml, so a newly added file is linted in full from the moment it
# arrives, and cleaning up a file means deleting its line from the todo.
#
# Long lines here come from long identifiers rather than dense logic, so they
# gain nothing from more room.
Layout/LineLength:
  Max: 80

# By default this cop demands a "# frozen_string_literal: true" comment at the
# top of every file. We deliberately add none: strings are already frozen
# globally at runtime via RUBYOPT=--enable-frozen-string-literal (see
# source/server/config/up.sh), so such a comment would be redundant. Mirrors
# the sibling repos (eg ../creator).
Style/FrozenStringLiteralComment:
  Exclude:
    - source/**/*

# Indent a multi-line hash one step in from the line that opens it, rather than
# aligning it under the opening paren. Aligning pushes deeply nested calls far
# to the right and reindents every key when the method name changes length.
Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent
