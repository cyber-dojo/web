
networks:
  cyber-dojo:
    driver: bridge

services:

  # The client (Capybara) tests in test/client drive Firefox here
  # and load the web app at http://nginx over the compose network, so they
  # exercise the rendered page and its JavaScript end to end (the in-process Rack
  # tests never run browser JS). amd64 image (emulated on arm hosts).
  #
  # In its own file, as nginx is, so the server tests can bring up what they
  # need without starting a browser grid they never drive.
  selenium:
    image: selenium/standalone-firefox
    platform: linux/amd64
    restart: no
    # So containers_up's --wait blocks until the grid is actually accepting
    # sessions on 4444, not merely until the container is running - otherwise
    # the first browser test can hit connection-refused. check-grid.sh ships in
    # the selenium image.
    healthcheck:
      test: [ "CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
