
networks:
  cyber-dojo:
    driver: bridge

services:

  nginx:
    image: ${CYBER_DOJO_NGINX_IMAGE}:${CYBER_DOJO_NGINX_TAG}
    depends_on:
      - web
    user: root
    init: true
    environment:
      # Passed through only when the caller sets them. Creator's browser-test
      # run sets the creator rates (see app-creator/bin/containers_up_healthy_and_clean.sh).
      # A demo driven at speed, e.g. to build up traffic-lights, can set the kata rates.
      # Unset, nginx uses the production values baked into its image.
      - CYBER_DOJO_CREATOR_CHOOSE_RATE
      - CYBER_DOJO_CREATOR_CREATE_RATE
      - CYBER_DOJO_KATA_FILE_EDIT_RATE
      - CYBER_DOJO_RUN_TESTS_RATE
    ports: [ "${CYBER_DOJO_NGINX_HOST_PORT}:80" ]
    restart: "no"

  # for demo
  web:
    depends_on:
      - creator
      - dashboard
      - differ
