
networks:
  cyber-dojo:
    driver: bridge

services:

  nginx:
    image: ${CYBER_DOJO_NGINX_IMAGE}:${CYBER_DOJO_NGINX_TAG}
    platform: linux/amd64
    depends_on:
      - web
    user: root
    init: true
    environment:
      # Passed through only when the caller sets them, which creator's
      # browser-test run does (see app-creator/bin/containers_up_healthy_and_clean.sh).
      # Unset, nginx uses the production values baked into its image.
      - CYBER_DOJO_CREATOR_CHOOSE_RATE
      - CYBER_DOJO_CREATOR_CREATE_RATE
    ports: [ "${CYBER_DOJO_NGINX_HOST_PORT}:80" ]
    restart: "no"

  # for demo
  web:
    depends_on:
      - creator
      - dashboard
      - differ
