name: 'Detect Drift'

on:
  schedule:
    - cron: '20 6,8,18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  detect-drift:
    strategy:
      fail-fast: false
      matrix:
        app: [ web ]
        environment: [ beta, prod ]
        include:
          - environment: beta
            aws_account_id: 244531986313
          - environment: prod
            aws_account_id: 274425519734
    name: ${{ matrix.app }} ${{ matrix.environment }}
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/detect-drift-env.yml
    with:
      app: ${{ matrix.app }}
      aws_account_id: ${{ matrix.aws_account_id }}
      environment: ${{ matrix.environment }}
