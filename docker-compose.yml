
networks:
  cyber-dojo:
    driver: bridge

services:

  web:
    image: ${CYBER_DOJO_WEB_IMAGE}:${CYBER_DOJO_WEB_TAG}
    build:
      context: .
      target: web
      args:
        - COMMIT_SHA
        - BASE_IMAGE
    user: nobody
    env_file: [ app-web/web.env ]
    restart: no
    volumes:
      - ./app-web/bin/create_v2_kata.rb:/web/source/script/create_v2_kata.rb:ro
      - ./app-web/source/server/web:/web/source/web:ro
      - ./app-web/test:/web/test:ro

  creator:
    image: ${CYBER_DOJO_CREATOR_IMAGE}:${CYBER_DOJO_CREATOR_TAG}
    build:
      context: .
      target: creator
      args:
        - COMMIT_SHA
    user: nobody
    env_file: [ .env, app-creator/creator.env ]
    read_only: true
    restart: no
    volumes:
      - ./app-creator/source/server:/app/source:ro
      - ./app-creator/test:/app/test:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777
          size: 10485760  # 10MB

  dashboard:
    image: ${CYBER_DOJO_DASHBOARD_IMAGE}:${CYBER_DOJO_DASHBOARD_TAG}
    build:
      context: .
      target: dashboard
      args:
        - COMMIT_SHA
    user: nobody
    depends_on:
      - differ
      - saver
    env_file: [ app-dashboard/dashboard.env ]
    read_only: true
    restart: no
    volumes:
      - ./app-dashboard/source/server:/dashboard/source:ro
      - ./app-dashboard/test:/dashboard/test:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777
          size: 10485760  # 10MB

  custom-start-points:
    image: ${CYBER_DOJO_CUSTOM_START_POINTS_IMAGE}:${CYBER_DOJO_CUSTOM_START_POINTS_TAG}
    user: nobody
    env_file: [ .env ]
    read_only: true
    tmpfs: /tmp
    restart: no

  exercises-start-points:
    image: ${CYBER_DOJO_EXERCISES_START_POINTS_IMAGE}:${CYBER_DOJO_EXERCISES_START_POINTS_TAG}
    user: nobody
    env_file: [ .env ]
    read_only: true
    tmpfs: /tmp
    restart: no

  languages-start-points:
    image: ${CYBER_DOJO_LANGUAGES_START_POINTS_IMAGE}:${CYBER_DOJO_LANGUAGES_START_POINTS_TAG}
    user: nobody
    env_file: [ .env ]
    read_only: true
    tmpfs: /tmp
    restart: no

  runner:
    image: ${CYBER_DOJO_RUNNER_IMAGE}:${CYBER_DOJO_RUNNER_TAG}
    user: root
    env_file: [ .env ]
    read_only: true
    tmpfs: /tmp
    restart: no
    volumes: [ "/var/run/docker.sock:/var/run/docker.sock" ]

  saver:
    image: ${CYBER_DOJO_SAVER_IMAGE}:${CYBER_DOJO_SAVER_TAG}
    user: saver
    env_file: [ .env ]
    read_only: true
    restart: no
    tmpfs: [ "/cyber-dojo:uid=19663,gid=65533", "/tmp:uid=19663,gid=65533" ]

  # The spooler is web's async write path: web POSTs the nine event writes
  # (kata_file_create ... kata_checked_out) here (SpoolerService), the spooler
  # durably buffers them and its drainer forwards them to the saver above in
  # tab_seq order. Reads and non-event writes stay direct web->saver. It owns its
  # own /sqlite volume (uid 19664 = the spooler user), separate from saver's
  # /cyber-dojo. web reaches it at hostname 'spooler' on CYBER_DOJO_SPOOLER_PORT.
  spooler:
    image: ${CYBER_DOJO_SPOOLER_IMAGE}:${CYBER_DOJO_SPOOLER_TAG}
    user: spooler
    env_file: [ .env ]
    read_only: true
    restart: no
    depends_on: [ saver ]
    tmpfs:
      - /sqlite:uid=19664,gid=65533
      - /tmp

  differ:
    image: ${CYBER_DOJO_DIFFER_IMAGE}:${CYBER_DOJO_DIFFER_TAG}
    user: nobody
    env_file: [ .env ]
    read_only: true
    tmpfs: /tmp
    restart: no

